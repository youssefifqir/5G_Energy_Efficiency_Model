# Simulation Configuration
simulation:
  # General settings
  seed: 42
  device: "cuda"  # "cuda" or "cpu"
  num_workers: 4  # Parallel environments (if needed)
  
  # Episode settings
  max_steps_per_episode: 100
  
  # Evaluation
  eval_frequency: 50  # Evaluate every N episodes
  eval_episodes: 10   # Number of episodes for evaluation
  
  # Checkpointing
  checkpoint_frequency: 100  # Save every N episodes
  keep_best_only: true
  
  # Logging
  log_frequency: 10  # Log every N episodes
  tensorboard_enabled: true
  save_plots: true
  
  # Scenarios (from paper)
  scenarios:
    scenario_1:
      name: "Massive MIMO Static"
      description: "K=5 users, M=50 antennas, static channels"
      n_users: 5
      n_antennas: 50
      channel_model: "rayleigh"
      mobility: false
      
    scenario_2:
      name: "Dynamic Network"
      description: "Users entering/leaving (adaptability test)"
      n_users: [3, 5, 7]  # Variable users
      user_change_prob: 0.05  # 5% chance per step
      channel_model: "rayleigh"
      mobility: true
      
    scenario_3:
      name: "Hardware Impairments"
      description: "Test robustness to imperfections"
      n_users: 5
      n_antennas: 50
      error_magnitude_range: [0.05, 0.15]
      channel_model: "rayleigh"
      mobility: false

# Baseline algorithms (from paper)
baselines:
  nash_equilibrium:
    enabled: true
    max_iterations: 100
    convergence_threshold: 1e-4
    
  max_power:
    enabled: true
    
  random:
    enabled: true
    n_samples: 100  # Average over samples
    
  waterfilling:
    enabled: true

# Metrics to track
metrics:
  - "global_ee"           # Global EE (ψ - equation 6)
  - "min_ee"              # Minimum EE (η - equation 7)
  - "mean_ee"             # Average user EE
  - "sum_rate"            # Total throughput
  - "qos_violations"      # % of QoS violations
  - "convergence_time"    # Steps to converge
  - "power_consumption"   # Total power used

# Visualization
visualization:
  plot_training: true
  plot_comparison: true
  plot_convergence: true
  save_format: ["png", "pdf"]
  dpi: 300
