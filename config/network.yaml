# ============================================================
# Network Configuration — Matched to Article (Section VIII-A)
# A. Zappone et al., "Energy-Efficient Power Control …" 2015
# ============================================================
network:
  # --- System dimensions ---
  n_users: 5          # K = 5  (article Case Study 1)
  n_blocks: 1         # N = 1  (single resource block)
  bandwidth: 1.0      # B = 1  MHz
  n_antennas: 50      # M = 50 (massive MIMO)

  # --- Channel parameters ---
  channel:
    path_loss_exponent: 3.76    # alpha (urban macro)
    shadowing_std: 8.0          # sigma_s [dB] (log-normal)

    # Noise parameters (article Section VII-A)
    noise_figure: 3.0           # F = 3 dB
    noise_psd: -174.0           # N0 = -174 dBm/Hz

    # Hardware impairments (eps_BS, eps_UE)
    # eps^2 = eps_BS^2 + eps_UE^2 => gamma_max = 1/eps^2
    #   eps=0.10 => gamma_max=100 (20 dB)
    #   eps=0.08 => gamma_max=156 (22 dB)
    error_magnitude_bs: 0.08    # BS hardware impairment
    error_magnitude_ue: 0.04    # UE hardware impairment
    # eps^2 = 0.0064+0.0016 = 0.008 => gamma_max = 125 (21 dB)

  # --- Power constraints ---
  # Article shows results for p_bar from -50 to -10 dBW
  # Optimal EE occurs around -35 to -25 dBW (0.3 - 3 mW)
  power:
    min_power_dBm: -20.0        # -20 dBm = 0.01 mW  (must include optimal range)
    max_power_dBm: 23.0         # 23 dBm = 200 mW   (typical UE max)
    circuit_power_dBm: 10.0     # p_c = 10 dBm = 10 mW (article value)

  # --- QoS constraints ---
  qos:
    enable_constraints: true
    min_rate_percentage: 20.0   # R = 20% (article Case Study 1)

  # --- Cell deployment ---
  deployment:
    cell_radius: 400.0          # meters
    min_user_distance: 35.0     # meters from BS
