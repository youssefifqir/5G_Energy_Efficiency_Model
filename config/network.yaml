# Network Configuration - BALANCED realistic 5G
network:
  # Number of users (K) - MODERATE increase
  n_users: 10  # ↓ from 20 (balanced load)
  
  # Number of resource blocks (N)
  n_blocks: 1
  
  # Bandwidth per block (MHz) - MODERATE reduction
  bandwidth: 0.8  # ↑ from 0.5 (balanced sharing)
  
  # Base station antennas (M) - Massive MIMO
  n_antennas: 50
  
  # Channel parameters - MORE REALISTIC
  channel:
    # Path loss model
    path_loss_exponent: 3.76
    shadowing_std: 8.0  # dB
    
    # Noise parameters - MODERATE increase
    noise_figure: 5.0  # ↓ from 7.0 dB (balanced)
    noise_psd: -174.0  # dBm/Hz
    
    # Hardware impairments - MODERATE
    error_magnitude_bs: 0.12  # ↓ from 0.15
    error_magnitude_ue: 0.03  # ↓ from 0.05
    
    # Channel estimation - MODERATE degradation
    pilot_power_tau: 0.03  # ↓ from 0.05
  
  # Power constraints - BALANCED range
  power:
    min_power: -45.0  # ↑ from -50.0 (less restrictive)
    max_power: -8.0   # ↑ from -5.0 (more realistic)
    
    # Circuit power per user - MODERATE
    circuit_power: 12.0  # ↓ from 15.0 dBm (balanced)
  
  # QoS constraints - MODERATE
  qos:
    # Minimum rate as percentage of max rate
    min_rate_percentage: 25.0  # ↓ from 30.0 (balanced QoS)
    
    # Enable QoS constraints
    enable_constraints: true
  
  # Deployment - MODERATE cell size
  deployment:
    cell_radius: 800.0  # ↓ from 1000.0 m (balanced)
    min_user_distance: 50.0  # meters from BS
