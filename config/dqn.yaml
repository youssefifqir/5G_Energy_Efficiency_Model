# ============================================================
# DQN Hyperparameters — Tuned for Decentralized Power Control
# ============================================================
dqn:
  # --- Network architecture ---
  network:
    hidden_layers: [128, 256, 128]   # 3 hidden layers
    activation: "relu"
    dropout: 0.0                     # No dropout (cleaner gradients)

  # --- Training parameters ---
  training:
    learning_rate: 0.0001            # Lower LR for stable convergence
    batch_size: 256
    gamma: 0.95                      # Discount factor (shorter horizon for power control)

    # Replay buffer
    buffer_size: 100000
    min_buffer_size: 2000            # Start training after this many transitions

    # Target network
    target_update_freq: 500
    soft_update_tau: 0.005           # Soft update rate

    # Exploration (epsilon-greedy)
    epsilon_start: 1.0
    epsilon_end: 0.02
    epsilon_decay: 0.9995            # Per-episode decay

    # Loss function
    loss_type: "huber"
    huber_delta: 1.0

  # --- Action space ---
  actions:
    n_levels: 32                     # 32 log-spaced power levels (good resolution)

  # --- Reward function ---
  reward:
    alpha_ee: 1.0                    # EE reward coefficient
    beta_qos: 5.0                    # QoS violation penalty (stronger to reduce violations)
    gamma_power: 0.02                # Power penalty coefficient (milder)
    ee_reference: 300000000.0        # 3e8 = 300 Mbit/J normalization (rewards in ~[-1,+1])

# --- Training schedule ---
schedule:
  total_episodes: 10000              # Enough for convergence
  max_steps_per_episode: 200         # Steps per episode
  eval_frequency: 100                # Evaluate every N episodes
  checkpoint_frequency: 500          # Save every N episodes
  log_frequency: 50                  # Print stats every N episodes
