# DQN Hyperparameters - Optimized for 3-day sprint
dqn:
  # Network architecture
  network:
    hidden_layers: [256, 512, 256]  # 3 hidden layers
    activation: "relu"
    dropout: 0.0  # No dropout for faster training
  
  # Training parameters
  training:
    # Learning
    learning_rate: 0.0003
    batch_size: 128
    gamma: 0.99  # Discount factor
    
    # Replay buffer
    buffer_size: 100000  # Reduced for speed
    min_buffer_size: 2000  # Start learning after 2k samples
    
    # Target network
    target_update_freq: 100  # Update every 100 steps
    soft_update_tau: 0.005  # Soft update parameter
    
    # Exploration (ε-greedy)
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.997  # Decay per episode
    
    # Loss function
    loss_type: "huber"  # "huber" or "mse"
    huber_delta: 1.0
  
  # Action space (discrete power levels)
  actions:
    n_levels: 30  # Number of discrete power levels
    # Will be linearly spaced between min_power and max_power
  
  # Reward function (equation 7 from your document)
  reward:
    alpha_ee: 10.0     # ↑ Augmenter (était 1.0)
    beta_qos: 5.0      # ↓ Réduire (était 10.0)
    gamma_power: 0.01  # Garder
    normalize_ee: true
    ee_scale: 100000.0  # ↑ Augmenter (était 100.0)

# Training schedule (FAST - 3 days)
schedule:
  # Phase 1: Exploration (short)
  exploration:
    n_episodes: 100
    epsilon_range: [1.0, 0.5]
  
  # Phase 2: Learning (main)
  learning:
    n_episodes: 400
    epsilon_range: [0.5, 0.1]
  
  # Phase 3: Refinement (short)
  refinement:
    n_episodes: 100
    epsilon_range: [0.1, 0.01]
  
  # Total: 600 episodes (~2h training)
  total_episodes: 600
